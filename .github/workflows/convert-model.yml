name: Convert Model (onnx2tf TF converter)

on:
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          pip install numpy==1.26.4
          pip install "tensorflow-cpu==2.17.0" "jax==0.4.33" "jaxlib==0.4.33"
          pip install demucs==4.1.0
          pip install onnx2tf==1.26.1

      - name: Convert with onnx2tf (TF converter)
        env:
          CONVERT_OUT: convert_out
        run: |
          set -o pipefail
          mkdir -p convert_out
          cd convert_out
          # Use the original ONNX from assets (restored from LFS)
          ONNX_MODEL="../../app/src/main/assets/models/htdemucs_fp16weights.onnx"
          if [ ! -f "$ONNX_MODEL" ]; then
            echo "ONNX model not found at $ONNX_MODEL"
            exit 1
          fi
          # Use TF converter backend for better op support
          # -tb tf_converter uses TensorFlow's TFLiteConverter
          onnx2tf -i "$ONNX_MODEL" -o . -tb tf_converter -cotof 2>&1 | tee ../convert_log.txt
          # Find the output tflite
          find . -name "*.tflite" -exec cp {} ../convert_out/ \;

      - name: Verify conversion
        run: |
          ls -la convert_out/

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: htdemucs-tflite
          path: |
            convert_out/*.tflite
            convert_log.txt
          if-no-files-found: error