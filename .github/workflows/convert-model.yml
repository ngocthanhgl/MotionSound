name: Convert Model TF Converter

on:
  workflow_dispatch:
  workflow_call:

jobs:
  convert-tflite:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          pip install numpy==1.26.4
          pip install "tensorflow-cpu==2.17.0" "jax==0.4.33" "jaxlib==0.4.33"
          pip install demucs==4.1.0
          pip install onnx2tf==1.26.1
          pip install huggingface_hub

      - name: Convert with onnx2tf (TF converter)
        env:
          CONVERT_OUT: convert_out
        run: |
          set -o pipefail
          mkdir -p convert_out
          cd convert_out
          ONNX_MODEL="htdemucs_fp16weights.onnx"
          if [ ! -f "$ONNX_MODEL" ]; then
            echo "Downloading ONNX from HF..."
            python -c "
from huggingface_hub import hf_hub_download
hf_hub_download(repo_id='StemSplitio/htdemucs-onnx', filename='htdemucs_fp16weights.onnx', local_dir='.', local_dir_use_symlinks=False)
"
          fi
          if [ ! -f "$ONNX_MODEL" ]; then
            echo "ONNX model download failed"
            exit 1
          fi
          onnx2tf -i "$ONNX_MODEL" -o . -tb tf_converter -cotof 2>&1 | tee ../convert_log.txt
          find . -name "*.tflite" -exec cp {} ../convert_out/ \;

      - name: Verify conversion
        run: |
          ls -la convert_out/

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: htdemucs-tflite
          path: |
            convert_out/*.tflite
            convert_log.txt
          if-no-files-found: error